services:
  db:
    image: postgres:16-alpine
    container_name: db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: clientefacil
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    volumes:
      - ../cliente-facil-database:/var/lib/postgresql/data
    networks:
      - main_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clientefacil"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Broker de mensageria. "management-alpine" já vem com o plugin de painel web
  # (http://localhost:15672) embutido, útil pra visualizar filas/mensagens durante o aprendizado.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672" # porta do protocolo AMQP, usada pelo backend pra publicar/consumir
      - "15672:15672" # porta do painel web de administração (management UI)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - main_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # SMTP mock pra dev/teste: qualquer e-mail enviado pela aplicação cai aqui em vez de sair de
  # verdade. UI web em :8025 pra inspecionar as mensagens recebidas.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025" # porta SMTP, usada pelo backend pra enviar
      - "8025:8025" # UI web pra visualizar os e-mails recebidos
    networks:
      - main_network

  backend:
    container_name: backend
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ../cliente-facil-java:/app
      - maven_cache:/home/ubuntu/.m2
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/clientefacil
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      MAIL_DEFAULT_HOST: mailhog
      MAIL_DEFAULT_PORT: 1025
    networks:
      - main_network
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ../cliente-facil-next:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
      INTERNAL_API_URL: http://backend:8080
    networks:
      - main_network
    depends_on:
      backend:
        condition: service_healthy

networks:
  main_network:
    driver: bridge

volumes:
  maven_cache:
  frontend_node_modules: